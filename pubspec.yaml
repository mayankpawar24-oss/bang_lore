name: continuum_health
description: "Ardius Care - AI-powered continuous healthcare coordination"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  table_calendar: ^3.2.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lucide_icons: ^0.257.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  http: ^1.2.2
  firebase_storage: ^13.5.0
  share_plus: ^13.3.0
  file_picker: ^12.1.3
  url_launcher: ^6.3.1
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/video/
